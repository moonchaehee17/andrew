<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수사8팀 사건관리</title>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f7f9fc; --line:#dde3ec;
  --text:#141c28; --muted:#67748a; --accent:#1c4f9c; --accent-soft:#e7eefa;
  --ok:#15803d; --ok-soft:#e6f4ea; --warn:#b45309; --warn-soft:#fdf1e0; --bad:#b91c1c; --bad-soft:#fbe9e9;
  --radius:10px; --shadow:0 1px 2px rgba(20,28,40,.06), 0 4px 14px rgba(20,28,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

.top{background:var(--accent); color:#fff; padding:0 20px; display:flex; align-items:center; gap:18px;
  height:56px; position:sticky; top:0; z-index:50; box-shadow:0 2px 10px rgba(28,79,156,.25)}
.brand{font-weight:700; font-size:16px; letter-spacing:-.3px; white-space:nowrap}
.brand small{display:block; font-weight:400; font-size:11px; opacity:.75; letter-spacing:0}
.tabs{display:flex; gap:2px; margin-left:8px; flex:1}
.tab{background:transparent; border:0; color:#cfdcf2; padding:8px 14px; border-radius:7px; cursor:pointer; font-size:13.5px; font-weight:500}
.tab:hover{background:rgba(255,255,255,.12); color:#fff}
.tab.on{background:#fff; color:var(--accent); font-weight:700}
.top .util{display:flex; gap:8px; align-items:center}
.top .util button{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); color:#fff;
  padding:6px 12px; border-radius:7px; cursor:pointer; font-size:12.5px}
.top .util button:hover{background:rgba(255,255,255,.26)}
.wrap{max-width:1280px; margin:0 auto; padding:20px}

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-h{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.card-h h2{margin:0; font-size:14.5px; font-weight:700; letter-spacing:-.2px}
.card-h .sub{color:var(--muted); font-size:12px; font-weight:400}
.card-b{padding:16px}
.grid{display:grid; gap:14px}
.muted{color:var(--muted)}
.right{margin-left:auto}
.btn{background:var(--accent); color:#fff; border:0; padding:8px 15px; border-radius:7px; cursor:pointer; font-weight:600; font-size:13px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.ghost{background:var(--panel2); color:var(--text); border:1px solid var(--line); font-weight:500}
.btn.ghost:hover{background:#eef2f8}
.btn.sm{padding:5px 11px; font-size:12.5px}
.btn.danger{background:var(--bad)}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:#fff; border:1px solid var(--line); border-radius:7px; padding:7px 10px; width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
textarea{resize:vertical; min-height:70px}
label.f{display:block; margin-bottom:12px}
label.f > span{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600}
table{width:100%; border-collapse:collapse}
th,td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle}
th{background:var(--panel2); color:var(--muted); font-size:11.5px; font-weight:700; letter-spacing:.2px; white-space:nowrap}
th.sortable{cursor:pointer; user-select:none; white-space:nowrap}
th.sortable:hover{background:#e6ecf5; color:var(--text)}
th.sortable.on{color:var(--accent)}
th.sortable .ind{margin-left:4px; font-size:9.5px; opacity:.35}
th.sortable.on .ind{opacity:1}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--accent-soft)}
.pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11.5px; font-weight:700; white-space:nowrap}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.neutral{background:var(--panel2); color:var(--muted); border:1px solid var(--line)}
.pill.accent{background:var(--accent-soft); color:var(--accent)}
.empty{padding:34px; text-align:center; color:var(--muted); font-size:13px}

.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow)}
.kpi .n{font-size:26px; font-weight:800; letter-spacing:-1px; line-height:1.2}
.kpi .l{font-size:12px; color:var(--muted); font-weight:600}
.members{display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:12px}
.mcard{border:1px solid var(--line); border-radius:9px; padding:12px 13px; background:var(--panel2); cursor:pointer}
.mcard.lead{border-color:var(--accent); background:var(--accent-soft)}
.mrow{display:flex; align-items:baseline; gap:7px}
.mrank{font-size:11.5px; color:var(--muted); font-weight:600}
.mname{font-weight:700; font-size:14.5px}
.mcount{margin-left:auto; font-size:20px; font-weight:800; letter-spacing:-.5px}
.mbar{height:7px; border-radius:4px; background:#dfe5ef; margin:9px 0 7px; overflow:hidden}
.mbar i{display:block; height:100%; border-radius:4px}
.mmeta{font-size:11.5px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap}
.alert-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px}
.alert-row:last-child{border-bottom:0}
.alert-row:hover{background:var(--accent-soft)}
.alert-row .txt{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.distrow{display:flex; align-items:center; gap:10px; margin-bottom:6px; cursor:pointer}
.distrow .nm{width:150px; font-size:12.5px; flex:none}
.distrow .b{flex:1; height:16px; background:#e6ebf3; border-radius:4px; overflow:hidden}
.distrow .b i{display:block; height:100%; background:var(--accent)}
.distrow b{width:26px; text-align:right; font-size:13px}

/* 진행 트래커 */
.phase{font-size:11px; font-weight:800; color:var(--accent); letter-spacing:.4px;
  margin:14px 0 4px; padding-left:2px; text-transform:none}
.phase:first-child{margin-top:0}
.step{display:flex; gap:12px; align-items:flex-start; padding:8px 10px; border-radius:8px; position:relative}
.step:hover{background:var(--panel2)}
.step .dot{width:26px; height:26px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-size:11.5px; font-weight:700; border:2px solid var(--line); background:#fff; color:var(--muted); cursor:pointer; z-index:2}
.step.optional .dot{border-style:dashed}
.step.done .dot{background:var(--ok); border-color:var(--ok); color:#fff; border-style:solid}
.step.cur .dot{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 0 4px var(--accent-soft); border-style:solid}
.step.skipped .dot{background:#eef1f6; border-color:var(--line); color:#a9b3c2; border-style:dashed}
.step.pending{background:var(--warn-soft)}
.step.pending .dot{border-color:#e0a95f; color:var(--warn)}
.step:not(:last-child)::after{content:""; position:absolute; left:22px; top:32px; bottom:-4px; width:2px; background:var(--line)}
.step.done:not(:last-child)::after{background:var(--ok)}
.step.done.cur:not(:last-child)::after{background:var(--line)}
.step .body{flex:1; min-width:0}
.step .nm{font-weight:600; font-size:13.5px}
.step.cur .nm{color:var(--accent); font-weight:800}
.step.skipped .nm{color:#a9b3c2; text-decoration:line-through}
.step .dt{font-size:11.5px; color:var(--muted)}
.step .act{opacity:0; transition:opacity .12s}
.step:hover .act{opacity:1}
.step .acts{display:flex; gap:5px; flex:none}

.note{border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:7px; padding:10px 12px; margin-bottom:9px; background:var(--panel2)}
.note .nh{display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:11.5px; color:var(--muted)}
.note .nb{white-space:pre-wrap; font-size:13px}

.mask{position:fixed; inset:0; background:rgba(15,22,35,.5); display:grid; place-items:center; padding:20px; z-index:100}
.modal{background:var(--panel); border-radius:12px; width:100%; max-width:560px; max-height:92vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:980px}
.modal.xl{max-width:1180px}
.modal-h{padding:15px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; position:sticky; top:0; background:var(--panel); z-index:3}
.modal-h h3{margin:0; font-size:15.5px; font-weight:700}
.modal-b{padding:18px}
.modal-f{padding:13px 18px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; position:sticky; bottom:0; background:var(--panel); z-index:3}
.two{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}

.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel2)}
.filters select,.filters input{width:auto; min-width:120px}
.filters input[type=text]{min-width:200px}
.banner{background:var(--warn-soft); border:1px solid #f0d3a6; color:#7c4a08; padding:10px 14px;
  border-radius:9px; margin-bottom:14px; display:flex; align-items:center; gap:10px; font-size:13px}

/* 종결 구분 선택 */
.choices{display:grid; gap:9px}
.choice{border:1px solid var(--line); border-radius:9px; padding:11px 14px; cursor:pointer; background:var(--panel2); text-align:left}
.choice:hover{border-color:var(--accent); background:var(--accent-soft)}
.choice b{display:block; font-size:14px}
.choice span{font-size:12px; color:var(--muted)}

/* 엑셀 가져오기 */
.drop{border:2px dashed var(--line); border-radius:10px; padding:34px 20px; text-align:center; background:var(--panel2); cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.drop b{display:block; font-size:15px; margin-bottom:5px}
.maps{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px 14px}
.maps label{display:block}
.maps label > span{display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:3px}
.prev{max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:8px}
.prev th{position:sticky; top:0; z-index:1}
.prev td{white-space:nowrap; max-width:190px; overflow:hidden; text-overflow:ellipsis}
tr.bad-row td{background:var(--bad-soft)}
tr.dup-row td{background:var(--warn-soft)}
.legend{display:flex; gap:14px; font-size:12px; color:var(--muted); flex-wrap:wrap; align-items:center}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px}

/* ── 차트 ──
   계열색은 검증된 2색 조합(파랑/주황)만 쓴다. 상태색(--ok/--warn/--bad)은
   계열에 쓰지 않고 '목표 초과' 같은 상태 표시에만 쓴다. */
.viz{
  --series-1:#2a78d6;          /* 접수 */
  --series-2:#eb6834;          /* 종결 */
  --grid:#e6e9ef;              /* 눈금선 (한 단계 흐린 회색, 실선) */
  --axis:#c8cedb;
  --ink-muted:#7c8799;
}
.viz svg{display:block; width:100%; height:auto; overflow:visible}
.viz .gridline{stroke:var(--grid); stroke-width:1}
.viz .axisline{stroke:var(--axis); stroke-width:1}
.viz .tick{fill:var(--ink-muted); font-size:10.5px}
.viz .vlabel{fill:var(--text); font-size:10.5px; font-weight:700}
.viz .refline{stroke:var(--ink-muted); stroke-width:1}
.viz .reftext{fill:var(--ink-muted); font-size:10px; font-weight:600}
.viz .hit{fill:transparent; cursor:default}
.viz .hit:hover + .mark, .viz .mark.hot{filter:brightness(1.12)}
.hbars{display:flex; flex-direction:column; gap:7px}
.hbar{display:flex; align-items:center; gap:9px; font-size:12.5px}
.hb-name{width:var(--nw,110px); flex:none; text-align:right; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hb-track{flex:1; height:14px; min-width:40px}
.hb-track i{display:block; height:100%; background:var(--series-1); border-radius:0 4px 4px 0}
.hbar:hover .hb-track i{filter:brightness(1.12)}
.hb-val{width:52px; flex:none; font-weight:700; font-size:12px}
.legend-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted); font-weight:600}
.legend-row i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
.kpis5{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:14px}
.kpi .d{font-size:12px; font-weight:700; margin-top:2px}
.kpi .sub{font-size:11px; color:var(--muted)}
#tip{
  position:fixed; z-index:200; pointer-events:none; opacity:0; transition:opacity .08s;
  background:#141c28; color:#fff; padding:7px 10px; border-radius:7px; font-size:12px;
  line-height:1.5; box-shadow:0 6px 20px rgba(0,0,0,.28); max-width:240px;
}
#tip b{color:#fff}
#tip .k{color:#b9c3d4}
.empty-viz{padding:26px; text-align:center; color:var(--muted); font-size:12.5px}
@media (max-width:1100px){ .kpis5{grid-template-columns:repeat(2,1fr)} }
.report h3{margin:20px 0 8px; font-size:14px; border-bottom:2px solid var(--text); padding-bottom:5px}
.report table{margin-bottom:6px}
@media print{
  .top,.filters,.no-print,.btn{display:none !important}
  body{background:#fff; font-size:11px}
  .wrap{max-width:none; padding:0}
  .card{border:0; box-shadow:none}
  th,td{padding:4px 6px; font-size:10.5px}
}
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .tabs{overflow-x:auto}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand">부산남부경찰서 수사8팀<small>사건 진행관리 · 팀원 관리</small></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="util">
    <button id="btn-new">+ 사건 접수</button>
    <button id="btn-xls">엑셀 불러오기</button>
    <button id="btn-backup">백업</button>
  </div>
</div>
<div class="wrap" id="app"></div>
<div id="modal-root"></div>
<div id="tip"></div>
<input type="file" id="file-import" accept=".json,application/json" style="display:none">
<input type="file" id="file-xls" accept=".xlsx,.csv,.txt" style="display:none">
<script>
/* ══════════════════════════════════════════════════════════════
   부산남부경찰서 수사8팀 사건관리
   - 모든 데이터는 이 PC의 브라우저 저장소에만 보관됩니다(외부 전송 없음).
   - 정기적으로 [백업]으로 파일을 내려받아 보관하세요.
   ══════════════════════════════════════════════════════════════ */

const KEY = 'nambu-team8-case-mgmt-v1';   // 저장 키는 유지(기존 데이터 자동 이관)
const DB_VERSION = 2;

/* ── 수사 진행 단계 ──
   opt:true  = 사건에 따라 거치지 않을 수 있는 선택 단계 (해당없음 처리 가능)
   review    = 팀장 검토 지정 단계
   branch    = 이 단계에서 조기 이탈(이송)이 발생할 수 있음                    */
const STAGES = [
  { n:'접수',                              p:'접수 · 분석' },
  { n:'사건분석 (범죄사실·구성요건 정리)',   p:'접수 · 분석', review:true },
  { n:'관할 검토',                          p:'접수 · 분석', branch:'타 관서 관할이면 이송으로 종결' },
  { n:'고소인(진정인)·피해자 조사',          p:'고소인 조사' },
  { n:'사건재분석 (수사방향 결정)',          p:'고소인 조사', review:true },
  { n:'강제수사 필요성 검토',                p:'자료 확보' },
  { n:'금융계좌추적용 압수수색영장 신청',    p:'자료 확보', opt:true },
  { n:'영장 집행 · 거래내역 분석',           p:'자료 확보', opt:true },
  { n:'계좌명의자 특정 · 관할 재검토',       p:'자료 확보', opt:true, branch:'자료상 타 관서 관할이면 이송으로 종결' },
  { n:'임의제출 · 수사자료 확보',            p:'자료 확보' },
  { n:'참고인 조사 · 객관자료 분석',         p:'피의자 수사' },
  { n:'피의자 특정 · 출석요구',              p:'피의자 수사' },
  { n:'체포영장 신청',                       p:'피의자 수사', opt:true },
  { n:'통신사실확인자료 제공요청',           p:'피의자 수사', opt:true },
  { n:'체포영장 집행 · 검거',                p:'피의자 수사', opt:true },
  { n:'피의자 조사 (피의자신문)',            p:'피의자 수사' },
  { n:'사건종합검토 (진술 대조·혐의 판단)',  p:'종결 절차', review:true },
  { n:'추가 수사',                           p:'종결 절차', opt:true },
  { n:'수사결과보고서 작성',                 p:'종결 절차' },
  { n:'사건당사자 통지',                     p:'종결 절차' },
  { n:'종결',                                p:'종결 절차' }
];
const LAST = STAGES.length - 1;
const PHASES = [...new Set(STAGES.map(s => s.p))];
const CASE_TYPES = ['고소', '고발', '진정', '인지', '송치전이송', '기타'];
const DISPOSITIONS = [
  { v:'송치',        d:'혐의가 인정되어 검찰 송치' },
  { v:'불송치',      d:'혐의 없음·죄가 안 됨 등 불송치 결정' },
  { v:'수사중지',    d:'피의자 소재불명 등 중지사유 발생' },
  { v:'타관서 이송', d:'관할이 다른 관서에 있어 이송' }
];

/* 구 11단계 → 신 21단계 이관표 */
const V1_MAP = [0, 1, 3, 4, 6, 15, 16, 17, 18, 19, 20];

/* ── 상태 ── */
let db = null;
let view = 'dash';
let openCaseId = null;
let filters = { owner:'', stage:'', status:'open', q:'' };
let sort = { key:'', dir:1 };          // key 가 비면 기본 정렬(긴급 우선 → 기한 순)

/* ── 유틸 ── */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 지역시간 기준 오늘 (UTC로 계산하면 한국에서 오전 9시 이전에 하루 전 날짜가 된다) */
const today = () => { const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
/* YYYY-MM-DD 에 n일을 더한다 (UTC 산술로 서머타임·시차 영향을 받지 않게) */
function addDays(d, n){
  if(!d) return '';
  const [y, m, dd] = d.split('-').map(Number);
  if(!y || !m || !dd) return '';
  return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10);
}
function daysBetween(a, b){ if(!a || !b) return null; return Math.round((new Date(b) - new Date(a)) / 86400000); }
function daysSince(d){ return d ? daysBetween(d, today()) : null; }
function fmt(d){ return d ? d.replace(/-/g, '.').slice(2) : '-'; }

/* ── 저장 / 로드 / 이관 ── */
function defaultDb(){
  const mk = (rank, name, lead=false) => ({ id:uid(), rank, name, lead, active:true });
  return {
    version: DB_VERSION,
    members: [
      mk('경감', '팀장', true), mk('경위', '송당호'), mk('경사', '배지혜'),
      mk('경사', '이종윤'), mk('경장', '이민화'), mk('순경', '김태안')
    ],
    cases: [],
    settings: { capTarget:10, capWarn:9, stallDays:14, dueSoonDays:7, dueDefaultDays:60 },
    lastBackupAt: null
  };
}
/* 구버전 데이터를 신 단계 체계로 이관한다. */
function migrate(d){
  if(!d || (d.version || 1) >= DB_VERSION) return d;
  (d.cases || []).forEach(c => {
    if(c.intakeNo === undefined){ c.intakeNo = c.caseNo || ''; delete c.caseNo; }
    const old = c.stages || [];
    const next = STAGES.map(() => ({ done:false, date:'', skip:false }));
    old.forEach((s, i) => {
      const ni = V1_MAP[i];
      if(ni === undefined || !s.done) return;
      next[ni].done = true; next[ni].date = s.date || '';
    });
    /* 완료 표시된 단계 사이에 비어 있는 필수 단계를 메운다 */
    const top = next.reduce((a, s, i) => s.done ? i : a, -1);
    for(let i = 0; i < top; i++){
      if(!next[i].done){ if(STAGES[i].opt) next[i].skip = true; else { next[i].done = true; next[i].date = next[top].date; } }
    }
    c.stages = next;
    c.stageIndex = V1_MAP[Math.min(c.stageIndex ?? 0, V1_MAP.length - 1)];
    (c.notes || []).forEach(n => { n.stage = V1_MAP[n.stage] ?? n.stage; });
    if(c.disposition === undefined) c.disposition = next[LAST].done ? '송치' : '';
  });
  d.version = DB_VERSION;
  return d;
}
function load(){
  let migrated = false;
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      migrated = (parsed.version || 1) < DB_VERSION;
      db = migrate(parsed);
    }
  }catch(e){ console.warn('저장소 읽기 실패', e); }
  if(!db || !db.members) db = defaultDb();
  db.settings = Object.assign(defaultDb().settings, db.settings || {});
  if(migrated) save();          // 이관 결과를 즉시 저장한다
  return db;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('저장에 실패했습니다. 브라우저 저장소 용량 또는 권한을 확인해 주세요.\n\n' + e.message); }
}

/* ── 도메인 ── */
function newCase(){
  return {
    id: uid(), intakeNo: '', charge: '', type: '고소', receivedAt: today(),
    ownerId: db.members[0].id, complainant: '', suspect: '',
    dueAt: addDays(today(), db.settings.dueDefaultDays),
    priority: 'normal', stageIndex: 0, stageEnteredAt: today(),
    stages: STAGES.map(() => ({ done:false, date:'', skip:false })),
    disposition: '', notes: [], memo: '',
    createdAt: today(), updatedAt: today()
  };
}
const isClosed  = c => c.stageIndex >= LAST && c.stages[LAST].done;
const openCases = () => db.cases.filter(c => !isClosed(c));
const member    = id => db.members.find(m => m.id === id) || { rank:'', name:'(미지정)' };
const memberLabel = id => { const m = member(id); return (m.rank ? m.rank + ' ' : '') + m.name; };
const caseById  = id => db.cases.find(c => c.id === id);
const loadOf    = id => openCases().filter(c => c.ownerId === id).length;

function progressPct(c){
  const active = c.stages.filter(s => !s.skip).length || 1;
  return Math.round(c.stages.filter(s => s.done && !s.skip).length / active * 100);
}
function loadLevel(n){
  const s = db.settings;
  if(n > s.capTarget) return 'bad';
  if(n >= s.capWarn)  return 'warn';
  return 'ok';
}
function stallDays(c){ return isClosed(c) ? null : daysSince(c.stageEnteredAt); }
function dueDays(c){ return (isClosed(c) || !c.dueAt) ? null : daysBetween(today(), c.dueAt); }

function caseAlerts(c){
  const out = [], s = db.settings;
  if(isClosed(c)) return out;
  const dd = dueDays(c);
  if(dd !== null && dd < 0)                   out.push({ lv:'bad',  txt:`기한 ${-dd}일 경과` });
  else if(dd !== null && dd <= s.dueSoonDays)  out.push({ lv:'warn', txt:`기한 D-${dd}` });
  const st = stallDays(c);
  if(st !== null && st >= s.stallDays)         out.push({ lv:'bad',  txt:`${STAGES[c.stageIndex].n} 단계 ${st}일 정체` });
  const unack = c.notes.filter(n => !n.ack).length;
  if(unack)                                    out.push({ lv:'warn', txt:`팀장 의견 미확인 ${unack}건` });
  return out;
}
function allAlerts(){
  const rows = [];
  openCases().forEach(c => caseAlerts(c).forEach(a => rows.push({ ...a, c })));
  const rank = { bad:0, warn:1 };
  return rows.sort((x, y) => rank[x.lv] - rank[y.lv]);
}

/* 선택 단계 i가 속한 연속 선택구간 [시작, 끝] */
function optRun(i){
  let a = i, b = i;
  while(a - 1 >= 0 && STAGES[a - 1].opt) a--;
  while(b + 1 < STAGES.length && STAGES[b + 1].opt) b++;
  return [a, b];
}
/* 그 선택구간을 이 사건에서 실제로 밟았는가 (하나라도 완료했으면 밟은 것) */
function optRunTouched(c, i){
  const [a, b] = optRun(i);
  for(let k = a; k <= b; k++) if(c.stages[k].done) return true;
  return false;
}
/* 단계 idx를 '현재 진행 중'으로 설정.
   앞의 필수 단계는 완료 처리한다.
   앞의 선택 단계는 '그 선택구간을 통째로 지나쳤고, 구간 안에 완료한 단계가 하나도 없을 때만'
   해당없음으로 자동 처리한다. 이미 영장을 신청한 사건의 집행·분석 단계를 임의로 지우지 않기 위함이며,
   정리되지 않은 단계는 '미처리'로 표시해 사용자가 완료/해당없음을 직접 고르게 한다. */
function setStage(c, idx){
  for(let i = 0; i < idx; i++){
    const st = c.stages[i];
    if(st.done) continue;
    if(STAGES[i].opt){ if(!st.skip && optRun(i)[1] < idx && !optRunTouched(c, i)) st.skip = true; }
    else { st.done = true; st.date = today(); st.skip = false; }
  }
  for(let i = idx; i < STAGES.length; i++){
    const done = (i === idx && idx === LAST);
    c.stages[i].done = done;
    c.stages[i].date = done ? today() : '';
    c.stages[i].skip = false;
  }
  if(c.stageIndex !== idx) c.stageEnteredAt = today();
  c.stageIndex = idx;
  if(idx !== LAST) c.disposition = '';
  c.updatedAt = today();
  save();
}
function markDone(c, i){
  const st = c.stages[i];
  st.done = true; st.skip = false; st.date = st.date || today();
  if(c.stageIndex === i) setStage(c, Math.min(i + 1, LAST));
  c.updatedAt = today();
  save();
}
function toggleSkip(c, i){
  const st = c.stages[i];
  st.skip = !st.skip;
  if(st.skip){ st.done = false; st.date = ''; if(c.stageIndex === i) setStage(c, Math.min(i + 1, LAST)); }
  c.updatedAt = today();
  save();
}

/* ══════════ 렌더링 ══════════ */
const TABS = [
  { id:'dash',    label:'대시보드' },
  { id:'list',    label:'사건 목록' },
  { id:'stats',   label:'월간 현황' },
  { id:'report',  label:'주간 보고' },
  { id:'members', label:'팀원 · 설정' }
];
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(t => `<button class="tab ${view === t.id ? 'on' : ''}" data-tab="${t.id}">${t.label}</button>`).join('');
}
function render(){
  renderTabs();
  const app = $('#app');
  if(view === 'dash')        app.innerHTML = viewDash();
  else if(view === 'list')   app.innerHTML = viewList();
  else if(view === 'stats')  app.innerHTML = viewStats();
  else if(view === 'report') app.innerHTML = viewReport();
  else                       app.innerHTML = viewMembers();
  if(openCaseId) renderDetail();
}
function backupBanner(){
  if(db.cases.length === 0) return '';
  const d = daysSince(db.lastBackupAt);
  if(db.lastBackupAt && d < 7) return '';
  const msg = db.lastBackupAt ? `마지막 백업 후 ${d}일 지났습니다.` : '아직 백업한 적이 없습니다.';
  return `<div class="banner no-print"><b>백업 안내</b>
    <span>${msg} 데이터는 이 브라우저에만 저장되므로, 주 1회 백업 파일을 내려받아 보관하세요.</span>
    <button class="btn sm right" data-act="backup">지금 백업</button></div>`;
}

/* ══════════ 대시보드 ══════════ */
function viewDash(){
  const open = openCases();
  const closedThisMonth = db.cases.filter(c => isClosed(c) && (c.stages[LAST].date || '').slice(0, 7) === today().slice(0, 7)).length;
  const alerts = allAlerts();
  const over = db.members.filter(m => m.active && loadOf(m.id) > db.settings.capTarget).length;

  const kpis = `<div class="kpis">
    <div class="kpi"><div class="n">${open.length}</div><div class="l">진행 중 사건</div></div>
    <div class="kpi"><div class="n" style="color:${over ? 'var(--bad)' : 'var(--ok)'}">${over}</div><div class="l">${db.settings.capTarget}건 초과 인원</div></div>
    <div class="kpi"><div class="n" style="color:${alerts.length ? 'var(--warn)' : 'var(--ok)'}">${alerts.length}</div><div class="l">점검 필요 항목</div></div>
    <div class="kpi"><div class="n">${closedThisMonth}</div><div class="l">이번 달 종결</div></div>
  </div>`;

  const cards = db.members.filter(m => m.active).map(m => {
    const n = loadOf(m.id), lv = loadLevel(n);
    const color = lv === 'bad' ? 'var(--bad)' : lv === 'warn' ? 'var(--warn)' : 'var(--ok)';
    const pct = Math.min(100, Math.round(n / db.settings.capTarget * 100));
    const mine = open.filter(c => c.ownerId === m.id);
    const stalled = mine.filter(c => (stallDays(c) ?? 0) >= db.settings.stallDays).length;
    const due = mine.filter(c => { const d = dueDays(c); return d !== null && d <= db.settings.dueSoonDays; }).length;
    return `<div class="mcard ${m.lead ? 'lead' : ''}" data-owner="${m.id}">
      <div class="mrow"><span class="mrank">${esc(m.rank)}</span><span class="mname">${esc(m.name)}</span>
        <span class="mcount" style="color:${color}">${n}<span style="font-size:12px;color:var(--muted);font-weight:600">/${db.settings.capTarget}</span></span></div>
      <div class="mbar"><i style="width:${pct}%;background:${color}"></i></div>
      <div class="mmeta">${stalled ? `<span class="pill bad">정체 ${stalled}</span>` : ''}${due ? `<span class="pill warn">기한임박 ${due}</span>` : ''}${(!stalled && !due) ? `<span class="pill ok">이상 없음</span>` : ''}</div>
    </div>`;
  }).join('');

  const alertRows = alerts.length ? alerts.slice(0, 25).map(a => `
    <div class="alert-row" data-open="${a.c.id}">
      <span class="pill ${a.lv}">${a.lv === 'bad' ? '긴급' : '주의'}</span>
      <span class="txt"><b>${esc(a.c.intakeNo || '(접수번호 미입력)')}</b> · ${esc(a.c.charge || '죄명 미입력')}
        <span class="muted">— ${esc(memberLabel(a.c.ownerId))}</span></span>
      <span class="muted" style="font-size:12px;white-space:nowrap">${esc(a.txt)}</span>
    </div>`).join('') : '<div class="empty">점검이 필요한 사건이 없습니다.</div>';

  /* 국면(phase)별 분포 — 21단계를 5개 국면으로 묶어 표시 */
  const byPhase = PHASES.map(p => ({ p, n: open.filter(c => STAGES[c.stageIndex].p === p).length }));
  const maxP = Math.max(1, ...byPhase.map(d => d.n));
  const phaseRows = byPhase.map(d => `<div class="distrow" data-phase="${esc(d.p)}">
      <span class="nm">${esc(d.p)}</span>
      <span class="b"><i style="width:${Math.round(d.n / maxP * 100)}%"></i></span><b>${d.n}</b></div>`).join('');

  const dist = STAGES.map((s, i) => ({ s, i, n: open.filter(c => c.stageIndex === i).length })).filter(d => d.n > 0);
  const maxN = Math.max(1, ...dist.map(d => d.n));
  const stageRows = dist.length ? dist.map(d => `<div class="distrow" data-stage="${d.i}">
      <span class="nm" style="width:210px;font-size:12px">${d.i + 1}. ${esc(d.s.n)}</span>
      <span class="b" style="height:12px"><i style="width:${Math.round(d.n / maxN * 100)}%"></i></span><b>${d.n}</b></div>`).join('')
    : '<div class="empty">진행 중인 사건이 없습니다.</div>';

  return backupBanner() + kpis + `
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card">
      <div class="card-h"><h2>팀원별 보유 사건</h2><span class="sub">목표 ${db.settings.capTarget}건 이하</span></div>
      <div class="card-b"><div class="members">${cards}</div></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>진행 국면별 분포</h2><span class="sub">진행 중 ${open.length}건</span></div>
      <div class="card-b">${phaseRows}
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
          <div class="muted" style="font-size:11.5px;font-weight:700;margin-bottom:7px">세부 단계</div>${stageRows}</div>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="card-h"><h2>점검 필요 사건</h2><span class="sub">기한 임박 · 단계 정체 ${db.settings.stallDays}일↑ · 팀장 의견 미확인</span></div>
    ${alertRows}
  </div>`;
}

/* ══════════ 사건 목록 ══════════ */
/* 목록 정렬 기준 — 열 머리글 클릭 시 사용 */
const SORT_COLS = [
  { k:'intakeNo', label:'접수번호', v:c => c.intakeNo || '' },
  { k:'charge',   label:'죄명',     v:c => c.charge || '' },
  { k:'owner',    label:'담당',     v:c => memberLabel(c.ownerId) },
  { k:'stage',    label:'진행 단계', v:c => c.stageIndex },
  { k:'stall',    label:'단계경과',  v:c => stallDays(c) },
  { k:'due',      label:'기한',     v:c => c.dueAt || '' },
  { k:'status',   label:'상태',     v:c => isClosed(c) ? 3
      : caseAlerts(c).some(a => a.lv === 'bad') ? 0 : caseAlerts(c).length ? 1 : 2 }
];
/* 값이 없는 행은 정렬 방향과 무관하게 항상 뒤로 보낸다 */
function comparator(key, dir){
  const get = SORT_COLS.find(c => c.k === key).v;
  return (a, b) => {
    const va = get(a), vb = get(b);
    const ea = va === '' || va == null, eb = vb === '' || vb == null;
    if(ea || eb) return (ea && eb) ? 0 : ea ? 1 : -1;
    if(typeof va === 'number') return (va - vb) * dir;
    return String(va).localeCompare(String(vb), 'ko') * dir;
  };
}
function filtered(){
  const q = filters.q.trim().toLowerCase();
  return db.cases.filter(c => {
    if(filters.status === 'open'   && isClosed(c)) return false;
    if(filters.status === 'closed' && !isClosed(c)) return false;
    if(filters.owner && c.ownerId !== filters.owner) return false;
    if(filters.stage !== '' && c.stageIndex !== +filters.stage) return false;
    if(q && !`${c.intakeNo} ${c.charge} ${c.complainant} ${c.suspect} ${c.memo}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort(sort.key ? comparator(sort.key, sort.dir) : (a, b) => {
    const ra = caseAlerts(a).some(x => x.lv === 'bad') ? 0 : 1;
    const rb = caseAlerts(b).some(x => x.lv === 'bad') ? 0 : 1;
    if(ra !== rb) return ra - rb;
    return (a.dueAt || '9999') < (b.dueAt || '9999') ? -1 : 1;
  });
}
function viewList(){
  const rows = filtered();
  const opts = (arr, sel, val, lab) => arr.map((x, i) =>
    `<option value="${val(x, i)}" ${String(val(x, i)) === String(sel) ? 'selected' : ''}>${esc(lab(x, i))}</option>`).join('');

  const body = rows.length ? rows.map(c => {
    const al = caseAlerts(c), dd = dueDays(c), st = stallDays(c), pct = progressPct(c);
    return `<tr class="row" data-open="${c.id}">
      <td><b>${esc(c.intakeNo || '-')}</b><div class="muted" style="font-size:11.5px">${esc(c.type)} · 접수 ${fmt(c.receivedAt)}</div></td>
      <td>${esc(c.charge || '-')}${c.priority === 'high' ? ' <span class="pill bad">중요</span>' : ''}</td>
      <td>${esc(memberLabel(c.ownerId))}</td>
      <td style="min-width:230px">
        <div style="font-size:12.5px;font-weight:600">${c.stageIndex + 1}. ${esc(STAGES[c.stageIndex].n)}</div>
        <div class="muted" style="font-size:11px">${esc(STAGES[c.stageIndex].p)} · ${pct}%</div>
        <span style="display:block;height:5px;background:#e6ebf3;border-radius:3px;margin-top:3px;overflow:hidden">
          <i style="display:block;height:100%;width:${pct}%;background:${isClosed(c) ? 'var(--ok)' : 'var(--accent)'}"></i></span></td>
      <td>${st === null ? '-' : `<span class="pill ${st >= db.settings.stallDays ? 'bad' : 'neutral'}">${st}일</span>`}</td>
      <td>${c.dueAt ? `<span class="pill ${dd === null ? 'neutral' : dd < 0 ? 'bad' : dd <= db.settings.dueSoonDays ? 'warn' : 'neutral'}">${fmt(c.dueAt)}${dd === null ? '' : dd < 0 ? ` (${-dd}일↑)` : ` (D-${dd})`}</span>` : '<span class="muted">-</span>'}</td>
      <td>${isClosed(c) ? `<span class="pill ok">${esc(c.disposition || '종결')}</span>`
          : al.length ? `<span class="pill ${al[0].lv}">${esc(al[0].txt)}</span>` : '<span class="pill neutral">정상</span>'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="7"><div class="empty">해당하는 사건이 없습니다.</div></td></tr>`;

  return backupBanner() + `<div class="card">
    <div class="filters no-print">
      <select data-f="status">
        <option value="open"   ${filters.status === 'open' ? 'selected' : ''}>진행 중</option>
        <option value="closed" ${filters.status === 'closed' ? 'selected' : ''}>종결</option>
        <option value=""       ${filters.status === '' ? 'selected' : ''}>전체</option></select>
      <select data-f="owner"><option value="">담당자 전체</option>
        ${opts(db.members.filter(m => m.active), filters.owner, m => m.id, m => `${m.rank} ${m.name} (${loadOf(m.id)})`)}</select>
      <select data-f="stage"><option value="">단계 전체</option>
        ${opts(STAGES, filters.stage, (s, i) => i, (s, i) => `${i + 1}. ${s.n}`)}</select>
      <input type="text" data-f="q" placeholder="접수번호 · 죄명 · 당사자 · 메모 검색" value="${esc(filters.q)}">
      ${sort.key ? `<button class="btn ghost sm" data-sort-reset>기본 정렬로</button>` : ''}

/* ══════════════════════════════════════════════════════════════
   월간 현황 — 사건처리 · 접수 · 보유
   차트는 외부 라이브러리 없이 인라인 SVG로 그린다.
   ══════════════════════════════════════════════════════════════ */

let stats = { months: 12, owner: '' };

const ym       = d => (d || '').slice(0, 7);
const ymLabel  = m => `${+m.slice(5, 7)}월`;
const ymFull   = m => `${m.slice(0, 4)}. ${m.slice(5, 7)}`;
const monthEnd = m => { const [y, mm] = m.split('-').map(Number);
  return new Date(Date.UTC(y, mm, 0)).toISOString().slice(0, 10); };
const closedAt = c => isClosed(c) ? (c.stages[LAST].date || '') : '';

/* 최근 n개월의 'YYYY-MM' 목록 (오래된 달 → 최근 달) */
function monthList(n){
  const out = [], now = today();
  let [y, m] = [+now.slice(0, 4), +now.slice(5, 7)];
  for(let i = 0; i < n; i++){
    out.unshift(`${y}-${String(m).padStart(2, '0')}`);
    if(--m === 0){ m = 12; y--; }
  }
  return out;
}

/* 기간·담당자 조건에 맞춘 월별 집계 */
function monthlyStats(){
  const months = monthList(stats.months);
  const pool = db.cases.filter(c => !stats.owner || c.ownerId === stats.owner);
  return months.map(m => {
    const end = monthEnd(m);
    const taken  = pool.filter(c => ym(c.receivedAt) === m);
    const closed = pool.filter(c => ym(closedAt(c)) === m);
    /* 월말 보유 = 그 달 말까지 접수됐고, 아직 종결되지 않았거나 그 뒤에 종결된 사건 */
    const held = pool.filter(c => c.receivedAt && c.receivedAt <= end
      && (!closedAt(c) || closedAt(c) > end)).length;
    const spans = closed.map(c => daysBetween(c.receivedAt, closedAt(c))).filter(v => v != null && v >= 0);
    return { m, taken: taken.length, closed: closed.length, held,
      avg: spans.length ? Math.round(spans.reduce((a, b) => a + b, 0) / spans.length) : null };
  });
}
/* 값별 건수를 많은 순으로 (상위 n개, 나머지는 '기타'로 묶음) */
function countBy(list, fn, top){
  const map = new Map();
  list.forEach(c => { const k = (fn(c) || '').trim() || '미입력'; map.set(k, (map.get(k) || 0) + 1); });
  let rows = [...map].map(([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n);
  if(top && rows.length > top){
    const rest = rows.slice(top).reduce((a, r) => a + r.n, 0);
    rows = rows.slice(0, top).concat({ k:'기타', n:rest });
  }
  return rows;
}

/* ── SVG 조각 ── */
const tip = (label, lines) =>
  `data-tip="${esc(label)}" data-tipbody="${esc(lines.join(' · '))}"`;
/* 눈금은 보기 좋은 수(1·2·5의 배수)로 끊되, 맨 위 눈금은 반드시 최대값 이상이어야 한다.
   (눈금을 최대값 이하에서 끊으면 막대·선이 그림 영역 밖으로 솟는다) */
function niceTicks(max, want = 4){
  if(!(max > 0)) return [0, 1];
  const raw = max / want, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw) || p * 10;
  const top = Math.ceil(max / step - 1e-9) * step;
  const out = [];
  for(let v = 0; v <= top + step * 1e-6; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}

/* 월별 접수·종결 — 묶은 세로 막대 (2계열) */
function chartTakenClosed(rows){
  if(!rows.some(r => r.taken || r.closed)) return '<div class="empty-viz">해당 기간에 접수·종결된 사건이 없습니다.</div>';
  const W = 760, H = 240, L = 38, R = 12, T = 16, B = 30;
  const pw = W - L - R, ph = H - T - B;
  const max = Math.max(1, ...rows.map(r => Math.max(r.taken, r.closed)));
  const ticks = niceTicks(max), top = ticks[ticks.length - 1];
  const y = v => T + ph - (v / top) * ph;
  const band = pw / rows.length;
  const bw = Math.min(22, (band - 8) / 2 - 1);      // 막대 24px 이하, 사이 2px 여백
  const bar = (x, v, cls) => v <= 0 ? '' :
    `<rect class="mark" x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(1, T + ph - y(v))}"
       rx="4" fill="${cls}" style="clip-path:inset(0 0 0 0 round 4px 4px 0 0)"/>`;
  return `<div class="viz">
    <div class="legend-row" style="margin-bottom:8px">
      <span><i style="background:var(--series-1)"></i>접수</span>
      <span><i style="background:var(--series-2)"></i>종결</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 접수 및 종결 건수">
      ${ticks.map(t => `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>
        <text class="tick" x="${L - 7}" y="${y(t) + 3.5}" text-anchor="end">${t}</text>`).join('')}
      <line class="axisline" x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}"/>
      ${rows.map((r, i) => {
        const cx = L + band * i + band / 2;
        const x1 = cx - bw - 1, x2 = cx + 1;
        return `<g ${tip(ymFull(r.m), [`접수 ${r.taken}건`, `종결 ${r.closed}건`,
                  `월말 보유 ${r.held}건`, r.avg != null ? `평균 처리 ${r.avg}일` : '종결 없음'])}>
          <rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${ph}"/>
          ${bar(x1, r.taken, 'var(--series-1)')}${bar(x2, r.closed, 'var(--series-2)')}
          <text class="tick" x="${cx}" y="${T + ph + 15}" text-anchor="middle">${ymLabel(r.m)}</text>
        </g>`;
      }).join('')}
      ${(() => { const last = rows[rows.length - 1], cx = L + band * (rows.length - 1) + band / 2;
        return `${last.taken ? `<text class="vlabel" x="${cx - bw / 2 - 1}" y="${y(last.taken) - 5}" text-anchor="middle">${last.taken}</text>` : ''}
                ${last.closed ? `<text class="vlabel" x="${cx + bw / 2 + 1}" y="${y(last.closed) - 5}" text-anchor="middle">${last.closed}</text>` : ''}`; })()}
    </svg></div>`;
}

/* 월말 보유 추이 — 단일 계열 선 + 옅은 면 */
function chartHeld(rows){
  if(!rows.length) return '';
  const W = 760, H = 200, L = 38, R = 30, T = 18, B = 28;
  const pw = W - L - R, ph = H - T - B;
  const goal = stats.owner ? db.settings.capTarget
             : db.settings.capTarget * db.members.filter(m => m.active).length;
  const dataMax = Math.max(1, ...rows.map(r => r.held));
  /* 목표선이 실제 값보다 지나치게 높으면 추이가 바닥에 깔리므로 선을 생략한다
     (목표치는 카드 부제에 글로 남는다) */
  const showGoal = goal <= dataMax * 1.4;
  const max = showGoal ? Math.max(dataMax, goal) : dataMax;
  const ticks = niceTicks(max), top = ticks[ticks.length - 1];
  const y = v => T + ph - (v / top) * ph;
  const x = i => rows.length === 1 ? L + pw / 2 : L + (pw * i) / (rows.length - 1);
  const pts = rows.map((r, i) => `${x(i)},${y(r.held)}`).join(' ');
  const last = rows[rows.length - 1];
  return `<div class="viz"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월말 보유 사건 추이">
      ${ticks.map(t => `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>
        <text class="tick" x="${L - 7}" y="${y(t) + 3.5}" text-anchor="end">${t}</text>`).join('')}
      ${showGoal ? `<line class="refline" x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}"/>
        <text class="reftext" x="${W - R}" y="${y(goal) - 5}" text-anchor="end">목표 ${goal}건</text>` : ''}
      <polygon fill="var(--series-1)" opacity="0.1" points="${L},${T + ph} ${pts} ${x(rows.length - 1)},${T + ph}"/>
      <polyline fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>
      <line class="axisline" x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}"/>
      ${rows.map((r, i) => `<g ${tip(ymFull(r.m), [`월말 보유 ${r.held}건`, `접수 ${r.taken}건`, `종결 ${r.closed}건`])}>
        <rect class="hit" x="${x(i) - pw / rows.length / 2}" y="${T}" width="${pw / rows.length}" height="${ph}"/>
        <circle cx="${x(i)}" cy="${y(r.held)}" r="4" fill="var(--series-1)" stroke="#fff" stroke-width="2"/>
        <text class="tick" x="${x(i)}" y="${T + ph + 15}" text-anchor="middle">${ymLabel(r.m)}</text></g>`).join('')}
      <text class="vlabel" x="${x(rows.length - 1) + 8}" y="${y(last.held) + 4}">${last.held}</text>
    </svg></div>`;
}

/* 가로 막대 — 크기 비교용 단일 색.
   항목 수에 따라 SVG viewBox 가 확대되며 글자까지 커지는 것을 피하려고 HTML 로 그린다. */
function chartBars(rows, opts = {}){
  if(!rows.length) return '<div class="empty-viz">표시할 자료가 없습니다.</div>';
  const max = Math.max(1, ...rows.map(r => r.n));
  return `<div class="viz hbars" style="--nw:${opts.nameW || 110}px" role="img" aria-label="${esc(opts.label || '')}">
    ${rows.map(r => `<div class="hbar" ${tip(r.k, [`${r.n}건`,
        opts.total ? `전체의 ${Math.round(r.n / opts.total * 100)}%` : ''].filter(Boolean))}>
      <span class="hb-name" title="${esc(r.k)}">${esc(r.k)}</span>
      <span class="hb-track"><i style="width:${r.n ? Math.max(1.5, r.n / max * 100) : 0}%"></i></span>
      <span class="hb-val">${r.n}${opts.unit || ''}</span>
    </div>`).join('')}
  </div>`;
}

/* ══════════════════════════════════════════════════════════════
   엑셀(.xlsx) / CSV 불러오기
   외부 라이브러리 없이 브라우저 내장 기능만 사용한다.
   .xlsx 는 ZIP 컨테이너이므로 직접 해제한 뒤 시트 XML을 읽는다.
   ══════════════════════════════════════════════════════════════ */

/* ZIP 해제 — 중앙 디렉터리를 훑어 필요한 파일만 꺼낸다. */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('올바른 엑셀(zip) 파일이 아닙니다.');
  const count = dv.getUint16(eocd + 10, true);
  let ptr = dv.getUint32(eocd + 16, true);
  const files = {};
  for(let i = 0; i < count; i++){
    if(dv.getUint32(ptr, true) !== 0x02014b50) break;
    const method = dv.getUint16(ptr + 10, true);
    const compSize = dv.getUint32(ptr + 20, true);
    const nameLen = dv.getUint16(ptr + 28, true);
    const extraLen = dv.getUint16(ptr + 30, true);
    const cmtLen = dv.getUint16(ptr + 32, true);
    const localOff = dv.getUint32(ptr + 42, true);
    const name = new TextDecoder().decode(u8.subarray(ptr + 46, ptr + 46 + nameLen));
    const lNameLen = dv.getUint16(localOff + 26, true);
    const lExtraLen = dv.getUint16(localOff + 28, true);
    const start = localOff + 30 + lNameLen + lExtraLen;
    files[name] = { method, bytes: u8.subarray(start, start + compSize) };
    ptr += 46 + nameLen + extraLen + cmtLen;
  }
  const out = {};
  for(const [name, f] of Object.entries(files)){
    if(!/^xl\/(worksheets\/|sharedStrings|workbook)/.test(name)) continue;
    if(f.method === 0){ out[name] = new TextDecoder().decode(f.bytes); continue; }
    if(f.method !== 8) throw new Error('지원하지 않는 압축 방식입니다. 엑셀에서 다시 저장해 주세요.');
    if(typeof DecompressionStream === 'undefined')
      throw new Error('이 브라우저는 xlsx 직접 읽기를 지원하지 않습니다. 엑셀에서 [다른 이름으로 저장 → CSV UTF-8]로 저장한 뒤 불러와 주세요.');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([f.bytes]).stream().pipeThrough(ds);
    out[name] = await new Response(stream).text();
  }
  return out;
}

const colToIdx = ref => {
  let n = 0;
  for(const ch of ref.replace(/[0-9]/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};
/* 엑셀 날짜 일련번호 → YYYY-MM-DD (1899-12-30 기준) */
function serialToDate(n){
  const ms = Math.round((n - 25569) * 86400000);
  const d = new Date(ms);
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}

async function parseXlsx(buf){
  const files = await unzip(buf);
  const dom = txt => new DOMParser().parseFromString(txt, 'application/xml');

  const shared = [];
  if(files['xl/sharedStrings.xml']){
    for(const si of dom(files['xl/sharedStrings.xml']).getElementsByTagName('si')){
      shared.push([...si.getElementsByTagName('t')].map(t => t.textContent).join(''));
    }
  }
  const sheetName = Object.keys(files).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a, b) => (+a.match(/\d+/)[0]) - (+b.match(/\d+/)[0]))[0];
  if(!sheetName) throw new Error('시트를 찾을 수 없습니다.');

  const rows = [];
  for(const row of dom(files[sheetName]).getElementsByTagName('row')){
    const arr = [];
    for(const cell of row.getElementsByTagName('c')){
      const i = colToIdx(cell.getAttribute('r') || '');
      const t = cell.getAttribute('t');
      let v = '';
      if(t === 's'){ v = shared[+cell.getElementsByTagName('v')[0]?.textContent] ?? ''; }
      else if(t === 'inlineStr'){ v = [...cell.getElementsByTagName('t')].map(x => x.textContent).join(''); }
      else { v = cell.getElementsByTagName('v')[0]?.textContent ?? ''; }
      arr[i < 0 ? arr.length : i] = String(v).trim();
    }
    rows.push([...arr].map(x => x ?? ''));
  }
  return rows.filter(r => r.some(v => v !== ''));
}

/* CSV — 따옴표·줄바꿈 포함 셀 처리 */
function parseCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    }else if(ch === '"') q = true;
    else if(ch === ',' || ch === '\t'){ row.push(cell.trim()); cell = ''; }
    else if(ch === '\n'){ row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
    else if(ch !== '\r') cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell.trim()); rows.push(row); }
  return rows.filter(r => r.some(v => v !== ''));
}
async function readTable(file){
  if(/\.xlsx$/i.test(file.name)) return parseXlsx(await file.arrayBuffer());
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if(/�/.test(text)){                       // 한글 깨짐 → 엑셀 기본 인코딩으로 재시도
    try{ text = new TextDecoder('euc-kr').decode(buf); }catch(e){}
  }
  return parseCsv(text);
}

  { k:'charge',      label:'죄명',            alias:['죄명','죄종','사건명','혐의','범죄명'] },
  { k:'ownerName',   label:'담당자',          alias:['담당','담당자','수사관','담당수사관','주무관','처리자'] },
  { k:'type',        label:'사건 구분',       alias:['구분','사건구분','접수구분','유형','종류','접수단서','단서'] },
  { k:'receivedAt',  label:'접수일',          alias:['접수일','접수일자','접수년월일','접수날짜','접수일시'] },
  { k:'dueAt',       label:'처리기한',        alias:['기한','처리기한','수사기일','만료일','처리기일','완료기한'] },
  { k:'complainant', label:'고소인/진정인',   alias:['고소인','진정인','피해자','고소인(진정인)','신고인'] },
  { k:'suspect',     label:'피의자',          alias:['피의자','피혐의자','피(혐)의자','상대방','피고소인'] },
  { k:'stageName',   label:'진행 단계',       alias:['단계','진행단계','진행상황','진행상태','수사단계','진행'] },
  { k:'priority',    label:'중요도',          alias:['중요도','우선순위','등급','지연'] },
  { k:'memo',        label:'메모',            alias:['메모','비고','특이사항','내용','요지'] }
];
const norm = s => String(s ?? '').replace(/[\s()\[\]·.\-_/]/g, '').toLowerCase();

/* 머리글 후보 점수 — 별칭과 '정확히' 일치하는 칸 수.
   KICS 조회 결과처럼 위쪽에 조회조건이 여러 줄 붙어 있어도 진짜 머리글 줄을 찾아낸다.
   ('접수번호   : ~' 같은 조건 줄은 정확히 일치하지 않으므로 0점이 된다) */
function headerScore(row){
  return FIELDS.filter(f => row.some(h => f.alias.some(a => norm(h) === norm(a)))).length;
}
function findHeaderRow(rows){
  let best = 0, bestScore = 0;
  for(let i = 0; i < Math.min(rows.length - 1, 40); i++){
    const sc = headerScore(rows[i]);
    if(sc > bestScore){ bestScore = sc; best = i; }
  }
  return bestScore >= 2 ? best : 0;
}
/* '2026-009126(08-28)' → 접수번호 2026-009126 + 접수일 2026-08-28
   KICS 조회 결과는 접수일 열이 따로 없고 접수번호 괄호 안에 월-일이 들어 있다. */
function splitIntakeNo(v){
  const t = String(v ?? '').trim();
  const m = t.match(/^(.*?)\s*\((\d{1,2})\s*[-.\/]\s*(\d{1,2})\)$/);
  if(!m) return { no:t, date:'' };
  const no = m[1].trim();
  const y = (no.match(/(\d{4})/) || [])[1];
  return { no, date: y ? `${y}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : '' };
}
/* KICS 진행상태 → 이 앱의 단계. 대략의 출발점이며 등록 후 사건별로 조정하면 된다. */
const STAGE_ALIAS = {
  '접수':0, '배당':0, '미배당':0, '미착수':0, '수리':0,
  '입건':1, '수사중':1, '조사중':1, '수사진행':1,
  '결정중':16, '결정':16, '송치결정':16, '검토중':16,
  '송치':20, '불송치':20, '수사중지':20, '종결':20, '완료':20, '이송':20
};
function autoMap(headers){
  const m = {};
  FIELDS.forEach(f => {
    const hit = headers.findIndex(h => f.alias.some(a => norm(h) === norm(a)));
    const loose = hit < 0 ? headers.findIndex(h => norm(h) && f.alias.some(a => norm(h).includes(norm(a)))) : hit;
    m[f.k] = loose >= 0 ? loose : -1;
  });
  return m;
}
/* 여러 형태의 날짜 표기를 YYYY-MM-DD 로 통일 */
function toDate(v){
  if(v === '' || v == null) return '';
  const s = String(v).trim();
  if(/^\d+(\.\d+)?$/.test(s) && +s > 20000 && +s < 80000) return serialToDate(+s);
  let m = s.match(/^(\d{4})[-.\/년\s]*(\d{1,2})[-.\/월\s]*(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function matchMember(name){
  const n = norm(name);
  if(!n) return null;
  const act = db.members.filter(m => m.active);
  return act.find(m => norm(m.name) === n)
      || act.find(m => n.includes(norm(m.name)) || norm(`${m.rank}${m.name}`) === n)
      || null;
}
function matchStage(v){
  const n = norm(v);
  if(!n) return 0;
  if(/^\d+$/.test(n)){ const i = +n - 1; return (i >= 0 && i <= LAST) ? i : 0; }
  if(STAGE_ALIAS[n] !== undefined) return STAGE_ALIAS[n];
  let i = STAGES.findIndex(s => norm(s.n) === n);
  if(i < 0) i = STAGES.findIndex(s => norm(s.n).includes(n) || n.includes(norm(s.n)));
  if(i < 0){
    const key = Object.keys(STAGE_ALIAS).find(k => n.includes(k));
    if(key) return STAGE_ALIAS[key];
  }
  return i < 0 ? 0 : i;
}

/* ── 가져오기 마법사 ── */
let imp = null;   // { rows, headers, map, defaultOwner, skipDup }

function startImport(rows, fileName){
  if(rows.length < 2) throw new Error('머리글 1줄과 자료 1줄 이상이 필요합니다.');
  const h = findHeaderRow(rows);
  const body = rows.slice(h + 1);
  if(!body.length) throw new Error('머리글 아래에 자료가 없습니다.');
  imp = {
    fileName, skippedRows: h, headers: rows[h], body,
    map: autoMap(rows[h]),
    defaultOwner: db.members[0].id,
    skipDup: true
  };
  renderImport();
}
function buildRows(){
  const g = (r, k) => { const i = imp.map[k]; return i >= 0 ? (r[i] ?? '') : ''; };
  const seen = new Set();
  /* 연결된 항목이 하나도 없는 줄은 자료가 아니라 구분선·쪽번호·발행일 같은 장식이므로 조용히 버린다 */
  const body = imp.body.filter(r => FIELDS.some(f => String(g(r, f.k) ?? '').trim() !== ''));
  return body.map(r => {
    const sp = splitIntakeNo(g(r, 'intakeNo'));
    const intakeNo = sp.no;
    const charge = String(g(r, 'charge')).trim();
    const ownerRaw = String(g(r, 'ownerName')).trim();
    const m = matchMember(ownerRaw);
    const typeRaw = String(g(r, 'type')).trim();
    const dupInFile = intakeNo && seen.has(intakeNo);
    if(intakeNo) seen.add(intakeNo);
    const dupInDb = intakeNo && db.cases.some(c => c.intakeNo === intakeNo);
    const err = (!intakeNo && !charge) ? '접수번호·죄명이 모두 비어 있음' : '';
    /* 접수일 열이 없으면 접수번호 괄호 안의 월-일을 쓴다 */
    const rec = toDate(g(r, 'receivedAt')) || sp.date || today();
    return {
      intakeNo, charge,
      type: CASE_TYPES.includes(typeRaw) ? typeRaw : '고소',
      ownerId: m ? m.id : imp.defaultOwner,
      ownerRaw, ownerMatched: !!m,
      receivedAt: rec,
      dueAt: toDate(g(r, 'dueAt')) || addDays(rec, db.settings.dueDefaultDays),
      complainant: String(g(r, 'complainant')).trim(),
      suspect: String(g(r, 'suspect')).trim(),
      stageIndex: matchStage(g(r, 'stageName')),
      priority: /중요|긴급|높|high|[●◎○]/i.test(String(g(r, 'priority'))) ? 'high' : 'normal',
      memo: String(g(r, 'memo')).trim(),
      err, dup: dupInDb || dupInFile
    };
  });
}

function runImport(){
  const rows = buildRows().filter(r => !r.err && !(imp.skipDup && r.dup));
  rows.forEach(r => {
    const c = newCase();
    Object.assign(c, {
      intakeNo:r.intakeNo, charge:r.charge, type:r.type, ownerId:r.ownerId,
      receivedAt:r.receivedAt, dueAt:r.dueAt, complainant:r.complainant,
      suspect:r.suspect, priority:r.priority, memo:r.memo
    });
    c.stages[0].done = true; c.stages[0].date = r.receivedAt;
    c.stageEnteredAt = r.receivedAt;
    db.cases.push(c);
    if(r.stageIndex > 0) setStage(c, r.stageIndex);
  });
  save();
  imp = null; $('#modal-root').innerHTML = ''; view = 'list'; filters.status = 'open'; render();
  const over = db.members.filter(m => m.active && loadOf(m.id) > db.settings.capTarget)
    .map(m => `${memberLabel(m.id)} ${loadOf(m.id)}건`);
  alert(`${rows.length}건을 등록했습니다.` + (over.length ? `\n\n목표(${db.settings.capTarget}건) 초과: ${over.join(', ')}\n배당 조정을 검토하세요.` : ''));
}

            마지막 백업: <b>${db.lastBackupAt ? fmt(db.lastBackupAt) : '없음'}</b></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            <button class="btn" data-act="backup">백업 파일 내려받기</button>
            <button class="btn ghost" data-act="restore">백업 파일 복원</button>
            <button class="btn ghost" data-act="csv">엑셀(CSV) 내보내기</button>
            <button class="btn ghost" data-act="template">가져오기 양식 내려받기</button>
          </div>
          <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
            <button class="btn danger sm" data-act="reset">전체 데이터 초기화</button></div>
        </div>
      </div>
    </div></div>`;
}

/* ══════════ 백업 / 내보내기 ══════════ */
function download(name, text, mime){
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function doBackup(){
  db.lastBackupAt = today(); save();
  download(`team8-backup-${today()}.json`, JSON.stringify(db, null, 2), 'application/json');
  render();
}
function doCsv(){
  const head = ['접수번호','구분','죄명','담당','접수일','처리기한','현재단계','진행률(%)','단계경과(일)','상태','종결구분','고소인','피의자','메모'];
  const lines = [head.join(',')];
  db.cases.forEach(c => lines.push([
    c.intakeNo, c.type, c.charge, memberLabel(c.ownerId), c.receivedAt, c.dueAt,
    `${c.stageIndex + 1}. ${STAGES[c.stageIndex].n}`, progressPct(c), stallDays(c) ?? '',
    isClosed(c) ? '종결' : '진행', c.disposition, c.complainant, c.suspect, (c.memo || '').replace(/\n/g, ' ')
  ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')));
  download(`team8-cases-${today()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function doRestore(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const next = JSON.parse(rd.result);
      if(!next.members || !next.cases) throw new Error('형식이 올바르지 않습니다.');
      if(!confirm(`복원하면 현재 데이터(사건 ${db.cases.length}건)가 백업 파일의 내용(사건 ${next.cases.length}건)으로 완전히 대체됩니다.\n계속할까요?`)) return;
      db = migrate(next);
      db.settings = Object.assign(defaultDb().settings, db.settings || {});
      save(); openCaseId = null; $('#modal-root').innerHTML = ''; render();
      alert('복원했습니다.');
    }catch(e){ alert('복원 실패: ' + e.message); }
  };
  rd.readAsText(file);
}

/* ══════════ 이벤트 ══════════ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-open],[data-owner],[data-stage],[data-phase],[data-act],[data-close],[data-close-mask],[data-edit],[data-del],[data-stage-set],[data-stage-undo],[data-stage-skip],[data-stage-done],[data-note-add],[data-note-del],[data-ack],[data-memo-save],[data-save-case],[data-m-add],[data-m-del],[data-s-save],[data-sort],[data-sort-reset],[data-st-csv],[data-imp-cancel],[data-imp-run],[data-imp-template],[data-dispo],[data-dispo-cancel]');
  if(!t) return;
  const d = t.dataset;
  const c = openCaseId ? caseById(openCaseId) : null;

  if(d.tab){ view = d.tab; render(); return; }
  /* 오름차순 → 내림차순 → 기본 정렬 순으로 순환한다 */
  if(d.sort){
    if(sort.key !== d.sort)      sort = { key:d.sort, dir:1 };
    else if(sort.dir === 1)      sort.dir = -1;
    else                         sort = { key:'', dir:1 };
    render(); return;
  }
  if(d.sortReset !== undefined){ sort = { key:'', dir:1 }; render(); return; }
  if(d.closeMask !== undefined && t === e.target){ openCaseId = null; $('#modal-root').innerHTML = ''; return; }
  if(d.close !== undefined){ openCaseId = null; $('#modal-root').innerHTML = ''; return; }
  if(d.open){ openCaseId = d.open; renderDetail(); return; }
  if(d.owner){ view = 'list'; filters.owner = d.owner; filters.stage = ''; filters.status = 'open'; render(); return; }
  if(d.phase){ view = 'list'; filters.stage = ''; filters.status = 'open'; render(); return; }
  if(d.stage !== undefined && d.stageSet === undefined && d.stageUndo === undefined
     && d.stageSkip === undefined && d.stageDone === undefined){
    view = 'list'; filters.stage = d.stage; filters.status = 'open'; render(); return; }

  if(d.act === 'backup'){ doBackup(); return; }
  if(d.act === 'csv'){ doCsv(); return; }
  if(d.act === 'template'){ downloadTemplate(); return; }
  if(d.stCsv !== undefined){ doStatsCsv(); return; }
  if(d.act === 'restore'){ $('#file-import').click(); return; }
  if(d.act === 'reset'){
    if(confirm('모든 사건과 팀원 정보가 삭제됩니다. 되돌릴 수 없습니다.\n먼저 백업하셨습니까?') && confirm('정말 초기화할까요?')){
      db = defaultDb(); save(); openCaseId = null; $('#modal-root').innerHTML = ''; render(); }
    return;
  }

  /* 가져오기 */
  if(d.impCancel !== undefined){ imp = null; $('#modal-root').innerHTML = ''; return; }
  if(d.impTemplate !== undefined){ downloadTemplate(); return; }
  if(d.impRun !== undefined){ runImport(); return; }

  /* 종결 구분 */
  if(d.dispoCancel !== undefined){ $('#modal-root').innerHTML = ''; if(openCaseId) renderDetail(); return; }
  if(d.dispo){
    const target = caseById(d.dispoCase);
    if(target){ setStage(target, LAST); target.disposition = d.dispo; save(); }
    openCaseId = d.dispoCase; render(); renderDetail(); return;
  }

  /* 사건 등록 / 수정 */
  if(d.edit){ renderForm(caseById(d.edit), false); return; }
  if(d.saveCase){
    const isNew = $('#modal-root').dataset.newCase === '1';
    const draft = JSON.parse($('#modal-root').dataset.draft);
    $$('#modal-root [data-k]').forEach(el => { draft[el.dataset.k] = el.value; });
    if(!draft.intakeNo.trim() && !draft.charge.trim()){ alert('접수번호 또는 죄명 중 하나는 입력해 주세요.'); return; }
    draft.updatedAt = today();
    if(isNew){
      draft.stages[0].done = true; draft.stages[0].date = draft.receivedAt || today();
      draft.stageEnteredAt = draft.receivedAt || today();
      db.cases.push(draft); save();
      const n = loadOf(draft.ownerId);
      $('#modal-root').innerHTML = '';
      if(n > db.settings.capTarget)
        alert(`${memberLabel(draft.ownerId)} 보유 사건이 ${n}건으로 목표(${db.settings.capTarget}건)를 초과했습니다.\n배당 조정 또는 조기 종결 검토가 필요합니다.`);
      openCaseId = draft.id; render(); renderDetail();
    }else{
      const idx = db.cases.findIndex(x => x.id === draft.id);
      db.cases[idx] = Object.assign(db.cases[idx], draft);
      save(); $('#modal-root').innerHTML = ''; render();
      if(openCaseId) renderDetail();
    }
    return;
  }
  if(d.del){
    const x = caseById(d.del);
    if(confirm(`[${x.intakeNo || x.charge}] 사건을 삭제할까요? 되돌릴 수 없습니다.`)){
      db.cases = db.cases.filter(y => y.id !== d.del);
      save(); openCaseId = null; $('#modal-root').innerHTML = ''; render(); }
    return;
  }

  /* 단계 */
  if(d.stageSet !== undefined && c){
    const i = +d.stageSet;
    if(i === LAST){ renderDisposition(c.id); return; }
    setStage(c, i); render(); renderDetail(); return;
  }
  if(d.stageUndo !== undefined && c){ setStage(c, +d.stageUndo); render(); renderDetail(); return; }
  if(d.stageSkip !== undefined && c){ toggleSkip(c, +d.stageSkip); render(); renderDetail(); return; }
  if(d.stageDone !== undefined && c){ markDone(c, +d.stageDone); render(); renderDetail(); return; }

  /* 팀장 의견 */
  if(d.noteAdd !== undefined && c){
    const txt = prompt(`[${STAGES[+d.noteAdd].n}] 단계 팀장 의견을 입력하세요.\n(수사 방향, 보완 지시, 검토 사항 등)`);
    if(txt && txt.trim()){
      c.notes.push({ id:uid(), stage:+d.noteAdd, text:txt.trim(), at:today(), ack:false, ackAt:'' });
      c.updatedAt = today(); save(); render(); renderDetail(); }
    return;
  }
  if(d.noteDel && c){
    if(confirm('이 의견을 삭제할까요?')){ c.notes = c.notes.filter(n => n.id !== d.noteDel); save(); render(); renderDetail(); }
    return;
  }
  if(d.ack && c){ const n = c.notes.find(x => x.id === d.ack); n.ack = true; n.ackAt = today(); save(); render(); renderDetail(); return; }
  if(d.memoSave !== undefined && c){
    c.memo = $('[data-memo]').value; c.updatedAt = today(); save();
    t.textContent = '저장됨 ✓'; setTimeout(() => { t.textContent = '메모 저장'; }, 1400);
    return;
  }

  /* 팀원 · 설정 */
  if(d.mAdd !== undefined){ db.members.push({ id:uid(), rank:'순경', name:'새 팀원', lead:false, active:true }); save(); render(); return; }
  if(d.mDel){
    if(loadOf(d.mDel) > 0){ alert('보유 사건이 있는 팀원은 삭제할 수 없습니다. 사건을 재배당한 뒤 삭제하거나, 재직 체크만 해제하세요.'); return; }
    if(confirm('이 팀원을 삭제할까요?')){ db.members = db.members.filter(m => m.id !== d.mDel); save(); render(); }
    return;
  }
  if(d.sSave !== undefined){
    $$('[data-s]').forEach(el => { db.settings[el.dataset.s] = Math.max(1, +el.value || 1); });
    save(); render(); return;
  }
});

/* 상단 버튼 */
$('#btn-new').onclick = () => renderForm(newCase(), true);
$('#btn-backup').onclick = doBackup;
$('#btn-xls').onclick = () => $('#file-xls').click();
$('#file-import').onchange = e => { if(e.target.files[0]) doRestore(e.target.files[0]); e.target.value = ''; };
$('#file-xls').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  try{ startImport(await readTable(f), f.name); }
  catch(err){ alert('파일을 읽지 못했습니다.\n\n' + err.message); }
};

/* 입력 반영 */
/* 처리기한은 접수일 + 기본일수로 자동 계산하되, 사용자가 직접 고치면 그 값을 유지한다 */
function syncDueField(){
  const due = $('#modal-root [data-k="dueAt"]');
  const hint = $('#modal-root [data-due-hint]');
  if(!due) return;
  if(hint) hint.textContent = due.dataset.autoDue === '1'
    ? `접수일 + ${db.settings.dueDefaultDays}일 자동 계산 — 직접 고치면 그 값이 유지됩니다`
    : '직접 지정한 기한입니다';
}
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.k === 'receivedAt'){
    const due = $('#modal-root [data-k="dueAt"]');
    if(due && due.dataset.autoDue === '1'){ due.value = addDays(el.value, db.settings.dueDefaultDays); }
    syncDueField(); return;
  }
  if(el.dataset.k === 'dueAt'){ delete el.dataset.autoDue; syncDueField(); return; }
  if(el.dataset.f !== undefined){
    filters[el.dataset.f] = el.value; render();
    if(el.type === 'text'){ const n = $(`[data-f="${el.dataset.f}"]`); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.st !== undefined){
    stats[el.dataset.st] = el.dataset.st === 'months' ? +el.value : el.value;
    render(); return;
  }
  if(el.dataset.m){
    const m = db.members.find(x => x.id === el.dataset.m);
    m[el.dataset.mk] = el.type === 'checkbox' ? el.checked : el.value;
    if(el.dataset.mk === 'lead' && el.checked) db.members.forEach(x => { if(x.id !== m.id) x.lead = false; });
    save(); if(el.type === 'checkbox') render();
    return;
  }
  if(imp){
    if(el.dataset.impMap !== undefined){ imp.map[el.dataset.impMap] = +el.value; renderImport(); return; }
    if(el.dataset.impOwner !== undefined){ imp.defaultOwner = el.value; renderImport(); return; }
    if(el.dataset.impSkipdup !== undefined){ imp.skipDup = el.checked; renderImport(); return; }
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ imp = null; openCaseId = null; $('#modal-root').innerHTML = ''; }
});

/* 차트 요소 위에서 따라다니는 설명 상자 */
document.addEventListener('mousemove', e => {
  const box = $('#tip');
  const g = e.target.closest('[data-tip]');
  if(!g){ box.style.opacity = '0'; return; }
  box.innerHTML = `<b>${esc(g.dataset.tip)}</b><br><span class="k">${esc(g.dataset.tipbody)}</span>`;
  box.style.opacity = '1';
  const r = box.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if(x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if(y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  box.style.left = x + 'px'; box.style.top = y + 'px';
});
document.addEventListener('mouseleave', () => { $('#tip').style.opacity = '0'; });

load();
render();
</script>
